<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Overall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: auction-floor — the lot on the block at center, two bidder paddles flanking, catalogue below */
:root{
  --bg:#EEF0F7; --card:#FFFFFF; --ink:#16182C; --muted:#5D6283; --line:#D6D9E8;
  --p1:#2B4BE0; --p1-soft:#E3E8FF; --p2:#C26A00; --p2-soft:#FFF0D6; --p2-fill:#F2A81D;
  --good:#1F8A4C; --stamp:#C8323A;
  --t-red:#C9302C; --t-gray:#B3B7C3; --t-gray-on:#16182C; --t-g2:#8C909B; --t-g2-on:#16182C; --t-g1:#4B4E57; --t-g1-on:#FFFFFF; --t-green:#23944F; --t-blue:#1F6FD6; --t-purple:#7B3FD1; --t-on:#FFFFFF;
  --t-diamond:linear-gradient(135deg,#E8F7FF,#B9E6F7 45%,#F4FBFF 60%,#A9D8EE); --t-diamond-on:#16182C;
  --f-display:"Archivo Black", "Arial Black", Impact, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1120; --card:#1A1D33; --ink:#ECEEF9; --muted:#9AA0C3; --line:#2C3050;
  --p1:#7C93FF; --p1-soft:#232B5C; --p2:#F5B53A; --p2-soft:#3A2A10; --p2-fill:#F2A81D;
  --good:#4CC983; --stamp:#FF6B72;
  --t-red:#F0605A; --t-gray:#BDC1CD; --t-gray-on:#0F1120; --t-g2:#8F93A1; --t-g2-on:#0F1120; --t-g1:#565A66; --t-g1-on:#ECEEF9; --t-green:#45C072; --t-blue:#5A9BFF; --t-purple:#AC7CF4; --t-on:#0F1120; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1120; --card:#1A1D33; --ink:#ECEEF9; --muted:#9AA0C3; --line:#2C3050;
  --p1:#7C93FF; --p1-soft:#232B5C; --p2:#F5B53A; --p2-soft:#3A2A10; --p2-fill:#F2A81D;
  --good:#4CC983; --stamp:#FF6B72;
  --t-red:#F0605A; --t-gray:#BDC1CD; --t-gray-on:#0F1120; --t-g2:#8F93A1; --t-g2-on:#0F1120; --t-g1:#565A66; --t-g1-on:#ECEEF9; --t-green:#45C072; --t-blue:#5A9BFF; --t-purple:#AC7CF4; --t-on:#0F1120; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,44px);letter-spacing:-.01em;line-height:1}
.brand h1 span{color:var(--p1)}
.logo{color:inherit;text-decoration:none;border-radius:6px}
.logo:hover{opacity:.85}
.logo:focus-visible{outline:3px solid var(--p1);outline-offset:3px}
.notes-btn{padding:8px 14px;font-size:14px}
.note-form{display:grid;gap:8px}
textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;resize:vertical;min-height:84px}
textarea:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.note{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.note.done{background:var(--bg)}
.note.done .note-text{text-decoration:line-through;color:var(--muted)}
.note input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--p1)}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.note-meta{font-size:12px;color:var(--muted);margin-top:4px}
.note-del{padding:6px 10px;font-size:13px}
.brand p{margin:0;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;column-gap:2.2em;row-gap:2px}
.home-actions{display:grid;gap:28px;width:100%;justify-items:center;padding-top:14px}
.home-sub{width:100%}
.home-actions button{padding:18px 16px;font-size:17px;border-radius:14px;text-align:center}
.home-actions .start-btn{padding:30px 20px;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,30px);letter-spacing:.01em;border-radius:16px}
/* Start spans the width of two small buttons plus the gap between them */
.home-sub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.home-actions .start-btn{width:calc(50% - 6px)}
.home-actions:has(#notesBtn[hidden]) .home-sub{grid-template-columns:repeat(3,minmax(0,1fr))}
.home-actions:has(#notesBtn[hidden]) .start-btn{width:calc((100% - 24px) / 3 * 2 + 12px)}
@media (max-width:640px){
  .home-sub,.home-actions:has(#notesBtn[hidden]) .home-sub{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-actions .start-btn,.home-actions:has(#notesBtn[hidden]) .start-btn{width:100%}
  .home-sub button{padding:14px 10px;font-size:15px}
}
.achs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.ach{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.ach.off{background:var(--bg);border-style:dashed}
.ach.off .ach-text{opacity:.65}
.medal{width:26px;height:26px;margin:5px;transform:rotate(45deg);border-radius:6px;background:var(--line)}
.ach.on .medal{background:var(--p1)}
.ach.on.gem .medal{background:var(--t-diamond);box-shadow:inset 0 0 0 1.5px var(--t-blue)}
.ach-text{display:grid;gap:2px;min-width:0}
.ach-text span{color:var(--muted);font-size:13.5px}
.ach-text .ach-meta{font-size:12px}
.newtag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--card);background:var(--good);padding:3px 7px;border-radius:6px}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--p1)}
.howto{font-size:13.5px;margin-bottom:8px}
.rules-block{padding-bottom:14px}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;font-weight:700}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Setup */
.setup{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:22px}
.rules{display:grid;gap:6px;margin:0;padding-left:20px;color:var(--muted);max-width:68ch}
.rules b{color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.opt{display:grid;gap:8px;align-content:start}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select,input[type=text]{font:inherit;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}

/* Game */
.board{display:grid;grid-template-columns:1fr minmax(0,1.3fr) 1fr;gap:16px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:1fr 1fr}.lot{grid-column:1/-1;order:-1}}
@media (max-width:440px){.board{grid-template-columns:1fr}}
.paddle{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0;transition:border-color .2s, box-shadow .2s}
.paddle.p0{--pc:var(--p1);--ps:var(--p1-soft)}
.paddle.p1{--pc:var(--p2);--ps:var(--p2-soft)}
.paddle.active{border-color:var(--pc);box-shadow:0 0 0 3px var(--ps)}
.paddle-head{display:flex;align-items:center;gap:10px}
.disc{width:34px;height:34px;border-radius:50%;background:var(--pc);color:var(--card);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;flex:none}
.paddle-head h3{font-size:16px;min-width:0;overflow-wrap:anywhere}
.cash{font-family:var(--f-mono);font-size:30px;font-weight:700;line-height:1}
.slots{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.slots li{border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-size:14px;min-height:38px;align-items:center}
.slots li.filled{border-style:solid;background:var(--ps);border-color:transparent;font-weight:600}
.slots li .num{color:var(--muted);font-size:13px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.lot-main{display:flex;justify-content:space-between;align-items:center;gap:16px}
.lot-name{flex:1;min-width:0}
.ico{width:32px;height:32px;flex:none;image-rendering:crisp-edges;image-rendering:pixelated}
.lot-img{width:128px;height:128px;flex:none;image-rendering:crisp-edges;image-rendering:pixelated}
@media (max-width:520px){.lot-img{width:96px;height:96px}}
.iname{display:flex;align-items:center;gap:8px;min-width:0}
.itemlist.has-img li{min-height:46px}
.iname > span{min-width:0;overflow-wrap:anywhere}
.rating{flex:none;text-align:center;border-radius:14px;padding:6px 12px 8px;min-width:84px;background:var(--tc);color:var(--to)}
.rating .label{color:inherit;opacity:.85}
.rnum{font-family:var(--f-mono);font-size:40px;font-weight:700;line-height:1}
.chip{display:inline-block;min-width:2.6em;text-align:center;padding:2px 6px;border-radius:6px;font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--tc);color:var(--to)}
.t-red{--tc:var(--t-red);--to:var(--t-on)} .t-gray{--tc:var(--t-gray);--to:var(--t-gray-on)} .t-g2{--tc:var(--t-g2);--to:var(--t-g2-on)} .t-g1{--tc:var(--t-g1);--to:var(--t-g1-on)} .t-green{--tc:var(--t-green);--to:var(--t-on)}
.t-blue{--tc:var(--t-blue);--to:var(--t-on)} .t-purple{--tc:var(--t-purple);--to:var(--t-on)} .t-diamond{--tc:var(--t-diamond);--to:var(--t-diamond-on)}
.bvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bv{border:1.5px solid var(--line);border-left:4px solid var(--pc);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.bv.p0{--pc:var(--p1)} .bv.p1{--pc:var(--p2)}
.bv-main{display:flex;align-items:center;gap:8px;font-size:16px;min-width:0;overflow-wrap:anywhere}
.bv-sub{font-size:13px;color:var(--muted)}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.hist-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;text-align:left;font-weight:500;padding:12px 14px}
.hist-meta{display:grid;gap:2px;min-width:0}
.hist-score{font-size:14px;font-weight:700;white-space:nowrap}
.res{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--bg);white-space:nowrap}
.res.win{color:var(--good)} .res.loss{color:var(--stamp)}
@media (max-width:520px){.hist-row{grid-template-columns:minmax(0,1fr) auto}.hist-score{grid-column:1/-1;grid-row:2}}
.cat-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cat-title{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,30px);line-height:1.1}
.levels{display:grid;gap:18px}
.level{display:grid;gap:8px}
.level-label{color:var(--ink)}
.level-head{display:flex;align-items:center;gap:10px}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.catbtn{padding:12px 14px;font-size:15px;min-width:0;display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px}
.catname{min-width:0;overflow-wrap:anywhere;text-align:center}
.cat-ico{width:32px;height:32px;flex:none;image-rendering:crisp-edges;image-rendering:pixelated}
.cat-ico.ph{display:block;border:1.5px dashed var(--line);border-radius:8px}
.catbtn .chip{flex:none}
.cat-avg{margin-left:auto;display:grid;justify-items:end;gap:4px}
.cat-avg .chip{font-size:20px;padding:4px 10px}
@media (max-width:640px){.catbtn{padding:12px 6px;font-size:13.5px;grid-template-columns:minmax(0,1fr);justify-items:center;gap:6px}.catname{overflow-wrap:break-word;hyphens:auto}}
.itemlist{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.itemlist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;background:var(--bg);font-size:15px}
.status{font-size:13px;color:var(--muted);min-height:1.2em}

.lot{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:20px;display:grid;gap:16px;position:relative;overflow:hidden;min-width:0}
.lot-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* Overall sits in the top-right corner in its own column, so it never overlaps the item name */
/* Auction box: lot label, then the item name in line with its Overall, then the icon centered above the bid line */
.lot-head{display:grid;gap:10px}
.lot-title{display:flex;align-items:center;justify-content:space-between;gap:14px}
.lot-title .lot-name{flex:1;min-width:0;overflow-wrap:break-word}
.lot-art{display:flex;justify-content:center;padding-top:4px}
/* Bid line: the current bid keeps its size; the high bidder takes the remaining width and its name shrinks to fit on one line */
.high{text-align:right;min-width:0;flex:1 1 0;display:grid;gap:2px;justify-items:end}
.hb{font-family:var(--f-mono);font-weight:700;font-size:clamp(20px,3vw,30px);line-height:1.1;color:var(--hc,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hb.none{color:var(--muted)}
/* The auction box takes a very light tint of the item's rating color */
.lot{background:var(--lot-bg,var(--card))}
.tint-purple{--lot-bg:color-mix(in srgb,var(--t-purple) 12%,var(--card))}
.tint-blue{--lot-bg:color-mix(in srgb,var(--t-blue) 12%,var(--card))}
.tint-red{--lot-bg:color-mix(in srgb,var(--t-red) 11%,var(--card))}
.tint-green{--lot-bg:color-mix(in srgb,var(--t-green) 12%,var(--card))}
.tint-gray{--lot-bg:color-mix(in srgb,var(--t-gray) 30%,var(--card))}
.tint-g2{--lot-bg:color-mix(in srgb,var(--t-g2) 22%,var(--card))}
.tint-g1{--lot-bg:color-mix(in srgb,var(--t-g1) 18%,var(--card))}
.tint-diamond{--lot-bg:linear-gradient(135deg,color-mix(in srgb,#B9E6F7 30%,var(--card)),color-mix(in srgb,#E8F7FF 22%,var(--card)) 55%,color-mix(in srgb,#A9D8EE 30%,var(--card)))}
.lot-name{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.4vw,34px);line-height:1.1;overflow-wrap:anywhere}
.bidline{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:nowrap;border-top:1.5px solid var(--line);padding-top:14px}
.bidline > div:first-child{flex:none}
.curbid{font-family:var(--f-mono);font-size:44px;font-weight:700;line-height:1}
.high{font-size:14px;color:var(--muted)}
.high b{color:var(--hc,var(--ink))}
.turnbar{border-radius:12px;padding:10px 12px;font-weight:700;background:var(--ts,var(--bg));color:var(--tc,var(--ink))}
.controls{display:grid;gap:10px}
.stepper{display:flex;gap:6px;align-items:stretch}
.stepper button{padding:8px 14px;font-family:var(--f-mono)}
.stepper input{flex:1;min-width:0;text-align:center;font-family:var(--f-mono);font-size:20px;font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .bid{background:var(--tc,var(--ink));border-color:var(--tc,var(--ink));color:var(--card)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.stamp{position:absolute;right:16px;top:44%;transform:rotate(-12deg) scale(.6);opacity:0;font-family:var(--f-display);font-size:34px;color:var(--stamp);border:4px solid var(--stamp);border-radius:10px;padding:2px 14px;pointer-events:none;transition:all .25s cubic-bezier(.3,1.6,.5,1);background:var(--card)}
.stamp.show{opacity:1;transform:rotate(-12deg) scale(1)}
@media (prefers-reduced-motion:reduce){.stamp{transition:none}}

.lower{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:36px}
@media (max-width:820px){.lower{grid-template-columns:1fr}}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.cat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0;padding:0;list-style:none}
@media (max-width:440px){.cat{grid-template-columns:1fr}}
.cat li{padding:7px 10px;border-radius:9px;font-size:14px;display:flex;justify-content:space-between;gap:8px;background:var(--bg)}
.cat li.gone{opacity:.45;text-decoration:line-through}
.cat li.now{outline:2px solid var(--ink);font-weight:700}
.cat li .tag{font-size:12px;font-weight:700;white-space:nowrap}
.log{margin:0;padding:0;list-style:none;display:grid;gap:4px;max-height:220px;overflow:auto;font-size:13.5px}
.log li{color:var(--muted)}
.log li:first-child{color:var(--ink);font-weight:600}

/* End */
.result{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:24px;display:grid;gap:18px}
.result h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,38px)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.team{border-radius:14px;padding:14px;background:var(--ps);display:grid;gap:8px}
.team.p0{--pc:var(--p1);--ps:var(--p1-soft)} .team.p1{--pc:var(--p2);--ps:var(--p2-soft)}
.team .row{display:flex;justify-content:space-between;gap:8px}
.team .total{font-family:var(--f-mono);font-size:34px;font-weight:700;color:var(--pc)}
.ranks{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.ranks li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--bg);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;grid-column:2/4}
.bar i{display:block;height:100%;background:var(--muted)}
.ranks li.o0 .bar i{background:var(--p1)} .ranks li.o1 .bar i{background:var(--p2-fill)}
</style>

<div class="wrap">
  <header class="brand">
    <h1><a href="#" id="logo" class="logo" aria-label="OverAll home">Over<span>All</span></a></h1>
    <p><span>Nine lots. Three slots. Bigger number wins.</span></p>
  </header>
  <main id="app"></main>
</div>

function renderSetup(){

  app.innerHTML = `
  <section class="setup">
    <div class="rules-block">
      <div class="label howto">How it works</div>
      <ol class="rules">
        <li>Each player starts with <b>$${START_CASH}</b>. Each game draws <b>9 random items</b> from a category of 33. Every item has a rating from 0 to 100.</li>
        <li>You only see an item when it comes up for auction, and its rating is shown while it's on the block. You never know what's coming next.</li>
        <li>Items come up one at a time. On your turn, <b>raise the bid</b> or <b>pass</b>. If you pass after someone bids, they win the item at that price. If both pass, the item is thrown out.</li>
        <li>You must keep $1 for every empty slot you still need to fill.</li>
        <li>Each player drafts <b>3 items</b>. Empty slots score 0. Your <b>final score</b> is your total rating <b>plus every dollar you have left</b>. Highest score wins.</li>

      <div class="opt"><label class="label" for="catSel">Category</label>

function catBtn(n){ const a=catAvg(n); return `<button type="button" class="catbtn" data-c="${esc(n)}" aria-label="${esc(n)}, overall ${a}">${catIcon(n)}<span class="catname">${esc(n)}</span><span class="chip ${tier(a)}">${a}</span></button>`; }
function renderCatalog(){

    <ol class="itemlist ${IMGS[name]?"has-img":""}">${items.map(([n,r],i)=>`<li><span class="label num">${i+1}</span><span class="iname">${img(name,n)}<span>${esc(n)}</span></span><span class="chip ${tier(r)}">${r}</span></li>`).join("")}</ol>
  </section>`;
  document.getElementById("catBack").onclick = renderCatalog;
  window.scrollTo(0,0);
}
function saveNames(){
  const a=document.getElementById("n1"), b=document.getElementById("n2");
  if(a) cfg.n1 = a.value.trim()||"Player 1";
  if(b) cfg.n2 = b.value.trim()||"Player 2";
}

/* ---------- Game ---------- */
function startGame(){
  clearTimeout(aiTimer); clearTimeout(lotTimer);
  const lvl = /^level:(\d+)$/.exec(cfg.cat);
  const cat = cfg.cat==="Random" ? shuffle(Object.keys(CATS))[0]
            : lvl ? shuffle(leveled()[Number(lvl[1])-1] || Object.keys(CATS))[0]
            : cfg.cat;
  const noise = NOISE[cfg.diff];
  const items = CATS[cat].map(([name,r],i)=>({id:i,name,r,est:Math.max(0,Math.min(100,r+rnd(-noise,noise))),owner:null,price:0,gone:false}));
  G = { mode:cfg.mode, cat, deck:shuffle(items).slice(0,LOTS), pool:items, idx:0,
    players:[{name: cfg.mode==="cpu"?"You":cfg.n1, cash:START_CASH, items:[]},{name: cfg.mode==="cpu"?`Computer (${cfg.diff})`:cfg.n2, cash:START_CASH, items:[]}],
    bid:0, high:null, turn:0, openPasses:0, solo:false, log:[] };
  log(`Category: ${cat}. The first lot is up.`);
  startLot();
}
function log(t){ G.log.unshift(t); }
function current(){ return G.deck[G.idx]; }

function startLot(){
  busy = false;
  const elig = [0,1].filter(p=>need(p)>0);
  if(G.idx>=G.deck.length || elig.length===0){ return renderEnd(); }
  G.bid=0; G.high=null; G.openPasses=0;
  G.solo = elig.length===1;
  G.turn = G.solo ? elig[0] : G.idx%2;
  renderGame();
  maybeAI();
}

function act(p, type, amt){
  if(busy || p!==G.turn) return;
  const it = current(), P = G.players[p], O = 1-p;
  if(G.solo){
    if(type==="take") return award(p,1);
    log(`${P.name} skipped ${it.name}.`); return discard();
  }
  if(type==="bid"){
    amt = Math.floor(amt);
    if(!(amt>G.bid && amt<=maxBid(p))) return;
    G.bid=amt; G.high=p; log(`${P.name} bids $${amt} on ${it.name}.`);
    if(maxBid(O) < amt+1){ log(`${G.players[O].name} can't go higher.`); return award(p,amt); }
    G.turn=O; renderGame(); return maybeAI();
  }
  // pass
  if(G.high!==null){ log(`${P.name} passes.`); return award(G.high,G.bid); }
  G.openPasses++; log(`${P.name} passes on ${it.name}.`);
  if(G.openPasses>=2) return discard();
  G.turn=O; renderGame(); maybeAI();
}
function award(p, price){
  const it=current(), P=G.players[p];
  P.cash-=price; P.items.push(it); it.owner=p; it.price=price; it.gone=true;
  log(`SOLD: ${it.name} to ${P.name} for $${price}.`);
  finishLot("SOLD");
}
function discard(){
  const it=current(); it.gone=true; it.owner=null;
  log(`${it.name} goes unsold.`);
  finishLot("PASSED");
}
function finishLot(word){
  busy=true; renderGame();
  const s=document.getElementById("stamp");
  if(s){ s.textContent=word; requestAnimationFrame(()=>s.classList.add("show")); }
  lotTimer = setTimeout(()=>{ G.idx++; startLot(); }, 1300);
}

/* ---------- Computer opponent ---------- */
function maybeAI(){
  clearTimeout(aiTimer);
  if(!isCpu(G.turn) || busy) return;
  aiTimer = setTimeout(aiMove, 850 + rnd(0,500));
}
function aiMove(){
  const p=1, s=need(p), it=current();
  const futureLots = G.deck.length - G.idx - 1;
  const seen = new Set(G.deck.slice(0,G.idx+1).map(x=>x.id));
  const unseen = G.pool.filter(x=>!seen.has(x.id)).map(x=>x.r);
  const mustTake = futureLots < s;
  let thr = 0;
  if(!mustTake){
    const k = Math.min(futureLots, s + (G.solo?0:need(0)));
    let sum=0; for(let n=0;n<40;n++){ const smp=shuffle(unseen).slice(0,futureLots).sort((a,b)=>b-a); sum+=smp[k-1]; }
    thr=sum/40;
  }
  const est = it.est;
  if(G.solo) return act(p, (est>=thr-3 || mustTake) ? "take" : "skip");
  // Leftover cash scores 1 point per dollar, so an item is worth its edge over the likely alternative.
  let willing = mustTake ? est - 1 : est - thr + 4;
  willing = Math.min(Math.floor(willing + rnd(-1,1)), maxBid(p));
  if(willing >= G.bid+1){
    const amt = Math.min(willing, G.bid + 1 + (G.bid===0 ? rnd(0,3) : rnd(0,2)));
    return act(p,"bid",amt);
  }
  act(p,"pass");
}

/* ---------- Render ---------- */
function paddle(p){
  const P=G.players[p], active=!busy && G.turn===p, full=need(p)===0;
  const slots=[0,1,2].map(i=>{const it=P.items[i]; return it?`<li class="filled"><span class="iname">${img(G.cat,it.name)}<span>${esc(it.name)}</span></span><span class="num"><span class="chip ${tier(it.r)}">${it.r}</span> $${it.price}</span></li>`:`<li><span class="label">Empty slot</span></li>`;}).join("");
  let st = full ? "Roster full" : active ? (isCpu(p)?"Thinking…":"Your move") : `Can bid up to $${maxBid(p)}`;
  return `<section class="paddle p${p} ${active?"active":""}" aria-label="${esc(P.name)}">
    <div class="paddle-head"><div class="disc">${p+1}</div><h3>${esc(P.name)}</h3></div>
    <div class="stats"><div><div class="label">Cash</div><div class="cash">$${P.cash}</div></div><div><div class="label">Overall</div><div class="cash">${P.items.reduce((a,i)=>a+i.r,0)}</div></div></div>
    <ul class="slots">${slots}</ul>
    <div class="status">${st}</div></section>`;
}
// Shrink the high bidder's name one pixel at a time until it fits beside the current bid (never below 10px).
function fitHighBidder(){
  const el = document.querySelector(".hb"); if(!el) return;
  el.style.fontSize = "";
  let size = parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth > el.clientWidth && size > 10){ size -= 1; el.style.fontSize = size + "px"; }
}
window.addEventListener("resize", fitHighBidder);
function renderGame(){
  const it=current(), t=G.turn, T=G.players[t];
  const tc = t===0?"var(--p1)":"var(--p2)", ts = t===0?"var(--p1-soft)":"var(--p2-soft)";
  const human = !isCpu(t) && !busy;
  const lo = G.bid+1, hi = maxBid(t);
  let controls;
  if(busy){ controls = `<p class="hint">Next lot coming up…</p>`; }
  else if(!human){ controls = `<p class="hint">${esc(T.name)} is deciding.</p>`; }
  else if(G.solo){
    controls = `<p class="hint">${esc(G.players[1-t].name)} is full. Take this item for $1 or skip it.</p>
      <div class="acts"><button class="bid" id="takeBtn" type="button">Take for $1</button><button id="passBtn" type="button">Skip</button></div>`;
  } else {
    const can = hi>=lo;
    controls = `<div class="stepper">
        <button type="button" id="dn" aria-label="Lower bid" ${can?"":"disabled"}>−</button>
        <input id="amt" type="number" inputmode="numeric" min="${lo}" max="${hi}" value="${can?lo:G.bid}" aria-label="Bid amount" ${can?"":"disabled"}>
        <button type="button" id="up" aria-label="Raise bid" ${can?"":"disabled"}>+</button>
      </div>
      <div class="acts"><button class="bid" id="bidBtn" type="button" ${can?"":"disabled"}>Bid $${can?lo:"—"}</button>
        <button id="passBtn" type="button">${G.high===null?"Pass":"Pass, let it go"}</button></div>
      <p class="hint">${can?`You can bid $${lo}–$${hi} and still afford your remaining slots.`:"You can't afford to raise. Pass to let it go."}</p>`;
  }
  const hc = G.high===0?"var(--p1)":"var(--p2)";
  app.innerHTML = `
  <div class="board">
    ${paddle(0)}
    <section class="lot tint-${tier(it.r).slice(2)}" style="--tc:${tc};--ts:${ts}" aria-live="polite">
      <div class="lot-head">
        <div class="lot-top"><span class="label">Lot ${G.idx+1} of ${G.deck.length} · ${esc(G.cat)}</span></div>
        <div class="lot-title"><h2 class="lot-name">${esc(it.name)}</h2><div class="rating ${tier(it.r)}"><div class="label">Overall</div><div class="rnum">${it.r}</div></div></div>
        ${img(G.cat,it.name,"lot-img") ? `<div class="lot-art">${img(G.cat,it.name,"lot-img")}</div>` : ""}
      </div>
      <div class="bidline">
        <div><div class="label">Current bid</div><div class="curbid">$${G.bid}</div></div>
        <div class="high" style="--hc:${hc}"><div class="label">High bidder</div><div class="hb ${G.high===null?"none":""}">${G.high===null?(G.solo?"Single bidder":"No bids yet"):esc(G.players[G.high].name)}</div></div>
      </div>
      ${busy?"":`<div class="turnbar">${isCpu(t) ? esc(T.name)+" is up" : (T.name==="You" ? "Your turn" : esc(T.name)+"'s turn")}</div>`}
      <div class="controls">${controls}</div>
      <div class="stamp" id="stamp" aria-hidden="true"></div>
    </section>
    ${paddle(1)}
  </div>
  <div class="lower">
    <section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="label">Auction log</div><button type="button" id="quit" style="padding:6px 10px;font-size:13px">New game</button></div><ul class="log">${G.log.slice(0,30).map(l=>`<li>${esc(l)}</li>`).join("")}</ul></section>
  </div>`;
  fitHighBidder();
  document.getElementById("quit").onclick = renderSetup;
  if(!human) return;
  if(G.solo){
    document.getElementById("takeBtn").onclick=()=>act(t,"take");
    document.getElementById("passBtn").onclick=()=>act(t,"skip");
    return;
  }
  const amt=document.getElementById("amt"), bidBtn=document.getElementById("bidBtn");
  const clamp=v=>Math.max(lo,Math.min(hi,Math.floor(Number(v)||lo)));
  const sync=v=>{amt.value=clamp(v); bidBtn.textContent=`Bid $${amt.value}`; bidBtn.disabled=false;};
  if(hi>=lo){
    document.getElementById("dn").onclick=()=>sync(Number(amt.value)-1);
    document.getElementById("up").onclick=()=>sync(Number(amt.value)+1);
    amt.oninput=()=>{ const raw=amt.value.trim(), v=Math.floor(Number(raw)); const ok=raw!=="" && v>=lo && v<=hi; bidBtn.textContent = raw==="" ? "Bid" : `Bid $${v}`; bidBtn.disabled=!ok; bidBtn.title = ok ? "" : `Enter $${lo}–$${hi}`; };
    amt.onchange=()=>sync(amt.value);
    amt.onkeydown=e=>{ if(e.key==="Enter"){ sync(amt.value); act(t,"bid",Number(amt.value)); } };
    bidBtn.onclick=()=>{ sync(amt.value); act(t,"bid",Number(amt.value)); };
  }
  document.getElementById("passBtn").onclick=()=>act(t,"pass");
}

/* ---------- Results + history ---------- */
const HIST_KEY = "overall-history-v1";
function loadHistory(){ try{ const h=JSON.parse(localStorage.getItem(HIST_KEY)||"[]"); return Array.isArray(h)?h:[]; }catch(e){ return []; } }
function saveHistory(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,50))); }catch(e){} }

function scoreOf(snap){
  const rat = snap.players.map(P=>P.items.reduce((s,i)=>s+i.r,0));
  const tot = snap.players.map((P,i)=>rat[i]+P.cash);
  const winLine = w => snap.mode==="cpu" ? (w===0?"You win.":"The computer wins.") : `${snap.players[w].name} wins.`;
  let head, winner=null;
  if(tot[0]!==tot[1]){ winner = tot[0]>tot[1]?0:1; head = winLine(winner); }
  else if(rat[0]!==rat[1]){ winner = rat[0]>rat[1]?0:1; head=`Tied on score. ${winLine(winner)} Higher ratings break the tie.`; }
  else head="A perfect tie.";
  return {rat, tot, head, winner};
}
function bestValue(items){
  if(!items.length) return null;
  return [...items].sort((a,b)=> (b.r/b.price - a.r/a.price) || (b.r-a.r))[0];
}
function modeLabel(snap){ return snap.mode==="cpu" ? `vs Computer · ${snap.diff}` : "Multiplayer"; }
function fmtDate(ts){ try{ return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }

function renderEnd(){
  clearTimeout(aiTimer);
  const snap = { ts:Date.now(), mode:G.mode, diff:cfg.diff, cat:G.cat,
    players:G.players.map(P=>({name:P.name, cash:P.cash, items:P.items.map(i=>({name:i.name,r:i.r,price:i.price}))})),
    lots:G.deck.map(x=>({name:x.name, r:x.r, owner:x.owner, price:x.price, gone:x.gone})) };
  const h = loadHistory(); h.unshift(snap); saveHistory(h);
  const newIds = recordAch(snap);
  renderResult(snap, false, newIds);
}

/* ---------- Achievements ---------- */
const ACH_KEY = "overall-achievements-v1";
const ACHIEVEMENTS = [
  {id:"top-shelf", name:"Top Shelf", desc:"Draft three items rated 90 or higher.",
   test:(s,p,r)=> s.players[p].items.length===3 && s.players[p].items.every(i=>i.r>=90)},
  {id:"diamond", name:"Diamond Win", desc:"Win with a 100-rated item on your roster.",
   test:(s,p,r)=> r.winner===p && s.players[p].items.some(i=>i.r>=100)},
  {id:"photo-finish", name:"Photo Finish", desc:"Win by exactly 1 point.",
   test:(s,p,r)=> r.winner===p && r.tot[p]-r.tot[1-p]===1},
  {id:"penny-pincher", name:"Penny Pincher", desc:"Win with $25 or more left over.",
   test:(s,p,r)=> r.winner===p && s.players[p].cash>=25},
  {id:"so-close", name:"So Close", desc:"Lose by exactly 1 point.",
   test:(s,p,r)=> r.winner===1-p && r.tot[1-p]-r.tot[p]===1},
  {id:"cash-is-king", name:"Cash Is King", desc:"Win a game your opponent's ratings would have won, thanks to your leftover cash.",
   test:(s,p,r)=> r.winner===p && r.tot[p]>r.tot[1-p] && r.rat[p]<=r.rat[1-p]},
];
function loadAch(){ try{ const a=JSON.parse(localStorage.getItem(ACH_KEY)||"{}"); return a&&typeof a==="object"?a:{}; }catch(e){ return {}; } }
function saveAch(a){ try{ localStorage.setItem(ACH_KEY, JSON.stringify(a)); }catch(e){} }
const humansOf = s => s.mode==="cpu" ? [0] : [0,1];
function earnedIn(s){
  const r = scoreOf(s), out = [];
  for(const a of ACHIEVEMENTS) for(const p of humansOf(s)) if(a.test(s,p,r)) out.push({a, p});
  return out;
}
function recordAch(s){
  const got = loadAch(), fresh = [];
  for(const {a,p} of earnedIn(s)){
    if(got[a.id]) continue;
    got[a.id] = {ts:s.ts, cat:s.cat, by: s.mode==="cpu" ? null : s.players[p].name};
    fresh.push(a.id);
  }
  if(fresh.length) saveAch(got);
  return fresh;
}
// One-time catch-up: games already in history count toward achievements. Runs once per device, so a reset stays reset.
function syncAchFromHistory(){
  try{ if(localStorage.getItem(ACH_KEY+"-synced")) return; }catch(e){ return; }
  const h = loadHistory(); for(let i=h.length-1;i>=0;i--) recordAch(h[i]);
  try{ localStorage.setItem(ACH_KEY+"-synced","1"); }catch(e){}
}
function achCard(a, info, opts={}){
  const on = !!info;
  const meta = on ? `Unlocked ${esc(fmtDate(info.ts))} · ${esc(info.cat)}${info.by?` · ${esc(info.by)}`:""}` : "Locked";
  return `<div class="ach ${on?"on":"off"} ${a.id==="diamond"?"gem":""}">
    <span class="medal" aria-hidden="true"></span>
    <div class="ach-text"><b>${esc(a.name)}</b><span>${esc(a.desc)}</span>${opts.hideMeta?"":`<span class="ach-meta">${meta}</span>`}</div>
    ${opts.isNew?`<span class="newtag">New</span>`:""}</div>`;
}
function renderAchievements(){
  clearTimeout(aiTimer); clearTimeout(lotTimer);
  syncAchFromHistory();
  const got = loadAch(), n = ACHIEVEMENTS.filter(a=>got[a.id]).length;
  app.innerHTML = `<section class="setup">
    <div class="cat-head"><button type="button" id="aBack">← Home</button><div><div class="label">Achievements · saved on this device</div><h2 class="cat-title">${n} of ${ACHIEVEMENTS.length} unlocked</h2></div></div>
    <div class="progress" role="img" aria-label="${n} of ${ACHIEVEMENTS.length} unlocked"><i style="width:${n/ACHIEVEMENTS.length*100}%"></i></div>
    <div class="achs">${ACHIEVEMENTS.map(a=>achCard(a, got[a.id])).join("")}</div>

}

function renderHistory(){
  clearTimeout(aiTimer); clearTimeout(lotTimer);
  const h = loadHistory();
  const rows = h.map((s,i)=>{ const {tot, winner} = scoreOf(s);
    const res = s.mode==="cpu" ? (winner===0?"Win":winner===1?"Loss":"Tie") : (winner===null?"Tie":`${s.players[winner].name} won`);
    const cls = s.mode==="cpu" ? (winner===0?"win":winner===1?"loss":"tie") : "tie";
    return `<li><button type="button" class="hist-row" data-i="${i}">
      <span class="hist-meta"><b>${esc(s.cat)}</b><span class="label">${esc(modeLabel(s))} · ${esc(fmtDate(s.ts))}</span></span>
      <span class="hist-score num"><span style="color:var(--p1)">${esc(s.players[0].name)} ${tot[0]}</span> – <span style="color:var(--p2)">${tot[1]} ${esc(s.players[1].name)}</span></span>
      <span class="res ${cls}">${esc(res)}</span></button></li>`; }).join("");
  app.innerHTML = `<section class="setup">
    <div class="cat-head"><button type="button" id="hBack">← Home</button><div><div class="label">Game history · saved on this device</div><h2 class="cat-title">${h.length} ${h.length===1?"game":"games"}</h2></div></div>
    ${h.length ? `<ol class="hist">${rows}</ol><div><button type="button" id="clearH">Clear history</button></div>` : `<p class="hint">Finished games show up here. Play one and come back.</p>`}
  </section>`;
  document.getElementById("hBack").onclick=renderSetup;
  app.querySelectorAll(".hist-row").forEach(b=>b.onclick=()=>renderResult(h[Number(b.dataset.i)], true));
  const c=document.getElementById("clearH");
  if(c){ let armed=false; c.onclick=()=>{ if(!armed){ armed=true; c.textContent="Tap again to clear all games"; return; } saveHistory([]); renderHistory(); }; }
  window.scrollTo(0,0);
}

/* ---------- Notes (kept in the game's own database, so they survive updates) ---------- */
let NDB = null, notes = [], notesState = "loading", notesTimer = null;
(async () => {
  const C = window.claude; if (!C || !C.use) return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use("db"), C.use("user")]); } catch (e) {}
  if (!db || !user) return;
  let ok = false; try { ok = await user.canEdit(); } catch (e) {}
  if (!ok) return;                       // only you and editors see Notes
  NDB = db;
  { const b = document.getElementById("notesBtn"); if (b) b.hidden = false; }
  notesTimer = setTimeout(() => { if (notesState === "loading") { notesState = "slow"; renderNoteList(); } }, 10000);
  db.collection("notes").orderBy("createdAt", "desc").onSnapshot(snap => {
    notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(notesTimer); notesState = "ready"; }
    else if (notesState === "loading") notesState = "ready";
    renderNoteList();
  }, () => { clearTimeout(notesTimer); notesState = "error"; renderNoteList(); });
})();

function renderNotes(){
  clearTimeout(aiTimer); clearTimeout(lotTimer); busy=false;
  app.innerHTML = `<section class="setup">
    <div class="cat-head"><button type="button" id="nBack">← Home</button><div><div class="label">Saved with the game · only you and editors see this</div><h2 class="cat-title">Notes</h2></div></div>
    <form id="noteForm" class="note-form">
      <label class="label" for="noteText">New note</label>
      <textarea id="noteText" maxlength="2000" placeholder="A category to add, a rating to fix, a feature idea…"></textarea>
      <div><button class="primary" type="submit" id="noteAdd">Add note</button></div>
      <p class="hint" id="noteMsg" aria-live="polite"></p>
    </form>
    <div id="noteList"></div>
  </section>`;
  document.getElementById("nBack").onclick = renderSetup;
  const ta = document.getElementById("noteText"), btn = document.getElementById("noteAdd"), msg = document.getElementById("noteMsg");
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); document.getElementById("noteForm").requestSubmit(); } });
  document.getElementById("noteForm").addEventListener("submit", async e => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text || !NDB) return;
    btn.disabled = true; msg.textContent = "Saving…";
    try { await NDB.collection("notes").add({ text, done: false, createdAt: Date.now() }); ta.value = ""; msg.textContent = "Saved."; }
    catch (err) { msg.textContent = err && err.code === "quota_exceeded" ? "The notes list is full. Delete a few old notes, then try again." : "That note didn't save. Check your connection and try again."; }
    btn.disabled = false; ta.focus();
  });
  renderNoteList();
  window.scrollTo(0,0);
}
function renderNoteList(){
  const box = document.getElementById("noteList"); if (!box) return;
  const fmt = ts => { try { return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); } catch (e) { return ""; } };
  const open = notes.filter(n => !n.done), done = notes.filter(n => n.done);
  let head = "";
  if (notesState === "loading" && !notes.length) { box.innerHTML = `<p class="hint">Loading notes…</p>`; return; }
  if (notesState === "error") head = `<p class="hint">Notes couldn't load. Reopen the game to try again.</p>`;
  if (notesState === "slow") head = `<p class="hint">Notes can't be reached right now. What's shown may be out of date.</p>`;
  if (!notes.length) { box.innerHTML = head + (notesState === "ready" ? `<p class="hint">No notes yet. Anything you add here stays with the game through every update, and Claude can read it when you ask for changes.</p>` : ""); return; }
  const li = n => `<li class="note ${n.done?"done":""}">
      <input type="checkbox" data-t="${esc(n.id)}" ${n.done?"checked":""} aria-label="Mark done">
      <div class="note-text">${esc(n.text||"")}<div class="note-meta">${esc(fmt(n.createdAt))}</div></div>
      <button type="button" class="note-del" data-d="${esc(n.id)}">Delete</button></li>`;
  box.innerHTML = head
    + `<div class="label" style="margin-bottom:8px">${open.length} open</div><ul class="notes">${open.map(li).join("")}</ul>`
    + (done.length ? `<div class="label" style="margin:18px 0 8px">${done.length} done</div><ul class="notes">${done.map(li).join("")}</ul>` : "");
  box.querySelectorAll("[data-t]").forEach(c => c.onchange = async () => {
    c.disabled = true;
    try { await NDB.doc("notes/" + c.dataset.t).update({ done: c.checked }); } catch (e) { c.checked = !c.checked; c.disabled = false; }
  });
  box.querySelectorAll("[data-d]").forEach(b => { let armed = false; b.onclick = async () => {
    if (!armed) { armed = true; b.textContent = "Tap to confirm"; return; }
    b.disabled = true;
    try { await NDB.doc("notes/" + b.dataset.d).delete(); } catch (e) { b.disabled = false; b.textContent = "Delete"; armed = false; }
  }; });
}

syncAchFromHistory();
document.getElementById("logo").addEventListener("click", e => { e.preventDefault(); renderSetup(); window.scrollTo(0,0); });
renderSetup();
</script>
